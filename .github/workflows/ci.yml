name: UIKitForge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test

      # Tách riêng bước này (dù cùng thuật toán với npm test) để check fail hiện rõ tên
      # "Pixel-diff regression gate" trong summary CI, thay vì chìm trong bước "Test" chung chung.
      - name: Pixel-diff regression gate
        run: node tests/pixel-diff.test.mjs

      - name: Build
        run: npm run build

  # SwiftLint trên Linux (image chính thức của realm) chạy ~1 phút, song song với job macOS (~3 phút, tốn phút macOS).
  # Lỗi lint thường gặp nhất nên báo sớm ở đây; job macOS vẫn giữ bước lint để đối chiếu đúng môi trường Xcode.
  swiftlint-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Dump generated fixtures
        run: node scripts/ci-dump-fixtures.mjs

      - name: swiftlint --strict (Linux)
        run: |
          docker run --rm -v "$PWD:/work" -w /work ghcr.io/realm/swiftlint:latest \
            swiftlint lint --strict --config ci-artifacts/.swiftlint.yml ci-artifacts

  native-validate:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Dump generated fixtures
        run: node scripts/ci-dump-fixtures.mjs

      - name: swiftc -typecheck (iOS 13 + 17, UIKit + SwiftUI)
        run: |
          set -e
          for dir in ci-artifacts/*-ios13; do
            for kind in uikit-xib uikit-code swiftui; do
              files=$(find "$dir/$kind" -name '*.swift')
              [ -z "$files" ] && continue
              echo "Typechecking $dir/$kind (iOS 13)"
              xcrun swiftc -typecheck -target arm64-apple-ios13.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" $files
            done
          done
          for dir in ci-artifacts/*-ios17; do
            for kind in uikit-xib uikit-code swiftui; do
              files=$(find "$dir/$kind" -name '*.swift')
              [ -z "$files" ] && continue
              echo "Typechecking $dir/$kind (iOS 17)"
              xcrun swiftc -typecheck -target arm64-apple-ios17.0-simulator -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" $files
            done
          done

      - name: ibtool --compile XIBs
        run: |
          set -e
          for xib in $(find ci-artifacts -name '*.xib'); do
            echo "Compiling $xib"
            ibtool --compile "${xib%.xib}.nib" "$xib"
          done

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: swiftlint --strict
        run: swiftlint lint --strict --config ci-artifacts/.swiftlint.yml $(find ci-artifacts -name '*.swift')

  # Độ giống thật: render code UIKit-Code sinh ra trên iOS Simulator, so pixel với ảnh Figma (secret FIGMA_TOKEN).
  # Chưa chặn merge (continue-on-error) — con số hiện ở job summary, ảnh render/diff trong artifact.
  visual-fidelity:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare snapshot package
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: node scripts/ci-snapshot-prepare.mjs

      - name: Render on iOS Simulator
        run: |
          set -e
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "Simulator: $DEVICE_ID"
          cd ci-snapshot
          # Scheme tự sinh của Swift package: "<Package>-Package" khi có, nếu không thì scheme của product.
          SCHEME=$(xcodebuild -list -json | python3 -c "import json,sys; s=json.load(sys.stdin)['workspace']['schemes']; print(next((x for x in s if x.endswith('-Package')), 'SnapshotHost'))")
          echo "Scheme: $SCHEME"
          TEST_RUNNER_SNAPSHOT_OUTPUT_DIR="$GITHUB_WORKSPACE/snapshot-output" \
          TEST_RUNNER_SNAPSHOT_REFERENCE_DIR="$GITHUB_WORKSPACE/ci-snapshot/references" \
          xcodebuild test -scheme "$SCHEME" -destination "id=$DEVICE_ID" -quiet

      - name: Report
        if: always()
        run: node scripts/ci-snapshot-report.mjs snapshot-output >> "$GITHUB_STEP_SUMMARY"

      - name: Upload images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-fidelity
          path: |
            snapshot-output
            ci-snapshot/references
          if-no-files-found: ignore
